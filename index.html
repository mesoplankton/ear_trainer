<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ear Trainer</title>
<style>
  :root{
    --bg:        #12151a;
    --panel:     #191d24;
    --panel-2:   #1f242c;
    --line:      #2b323d;
    --text:      #d8dee6;
    --text-dim:  #8891a0;
    --accent:    #7fd88f;
    --accent-2:  #e0a458;
    --bad:       #d9705f;
    --mono: "JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace;
    --sans: "Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:24px 16px 60px;}
  .wrap{max-width:780px;margin:0 auto;}

  header{margin-bottom:28px;}
  header .kicker{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.02em;}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;}
  header h1{margin:4px 0 6px;font-size:26px;font-weight:600;letter-spacing:-.01em;}
  header p{margin:0;color:var(--text-dim);font-size:14px;line-height:1.5;max-width:60ch;}

  .social-block{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:6px;}
  .social-text{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .social-icons{display:flex;gap:10px;}
  .social-icons a{color:var(--text-dim);display:inline-flex;transition:color .15s;}
  .social-icons a:hover{color:var(--accent);}
  .social-icons svg{width:20px;height:20px;display:block;}

  nav.tabs{display:flex;gap:2px;margin:24px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  nav.tabs button{
    flex:1;min-width:120px;background:none;border:none;color:var(--text-dim);font-family:var(--sans);
    font-size:13px;padding:10px 6px;cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
  nav.tabs button:hover{color:var(--text);}

  .download-btn{

    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--sans);font-size:18px;padding:10px 16px;border-radius:4px;cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:16px;}
  .panel + .panel{margin-top:12px;}
  .panel h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--text-dim);}

  .source-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  select, input[type=file]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--sans);font-size:13px;padding:8px 10px;border-radius:4px;
  }
  .filename{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:8px;}

  .transport{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  button.btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--sans);font-size:14px;padding:10px 16px;border-radius:4px;cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button.btn:hover{border-color:var(--accent);}
  button.btn:disabled{opacity:.4;cursor:default;}
  button.btn.playing{border-color:var(--accent);color:var(--accent);}
  button.btn.primary{background:var(--accent);color:#0d1310;border-color:var(--accent);font-weight:600;}
  button.btn.primary:hover{filter:brightness(1.08);}

  .readout{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:10px;min-height:16px;}

  .options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
  @media (max-width:560px){.options{grid-template-columns:1fr 1fr;}}
  @media (max-width:360px){.options{grid-template-columns:1fr;}}
  button.opt{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:13px;padding:12px 8px;border-radius:4px;cursor:pointer;
    text-align:center;transition:border-color .15s, background .15s;
  }
  button.opt:hover:not(:disabled){border-color:var(--accent);}
  button.opt.correct{border-color:var(--accent);background:rgba(127,216,143,.12);color:var(--accent);}
  button.opt.wrong{border-color:var(--bad);background:rgba(217,112,95,.12);color:var(--bad);}
  button.opt:disabled{cursor:default;}

  .scorebar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .scorebar b{color:var(--accent);}

  .vol-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .vol-row label{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  input[type=range]{flex:1;accent-color:var(--accent);}

  .hint{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:2px;}
  .viz{margin-top:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:20px;}
  .viz:empty{display:none;}

  .gain-picker{display:flex;flex-wrap:wrap;gap:16px;}
  .gain-picker label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}
  .gain-picker input{accent-color:var(--accent);}

  .mode-toggle{display:flex;gap:6px;margin-top:12px;}
  .mode-btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    font-family:var(--sans);font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .mode-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(127,216,143,.08);}
  .mode-btn:hover{color:var(--text);}
  .clickhint{color:var(--accent-2);}

  .spectrum-box{margin-top:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px;}
  canvas#spectrumCanvas{display:block;width:100%;height:221px;}

  footer{margin-top:36px;font-size:11px;color:var(--text-dim);font-family:var(--mono);text-align:center;}
</style>
</head>
